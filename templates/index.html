<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Zimple AI</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --sidebar:#fafafa;
    --border:#ececec;
    --border-strong:#e2e2e5;
    --text:#1a1a1a;
    --muted:#8a8a8e;
    --hover:#f2f2f4;
    --bubble-user:#1a1a1a;
    --bubble-ai:#f5f5f7;
    --danger:#dc4c4c;
    --accent:#4a7ee4;
    --ok:#54a054;
    --computer:#2e9e6a;
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100vh;
    height:100dvh;
    overscroll-behavior:none;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;
    -webkit-font-smoothing:antialiased;
    font-size:14px;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;color:inherit}
  input,textarea,select{font-family:inherit}
  .app{display:flex;height:100vh;height:100dvh}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:264px;flex-shrink:0;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:16px 12px 12px;gap:6px;
    overflow:hidden;
  }
  .brand{
    display:flex;align-items:center;gap:9px;
    padding:4px 10px 14px;
    font-weight:600;font-size:15px;letter-spacing:-.01em;
    flex-shrink:0;
  }
  .brand-dot{
    width:9px;height:9px;border-radius:50%;
    background:linear-gradient(135deg,#1a1a1a,#4a4a4a);
    animation:pulse 2.6s var(--ease) infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(1.25);opacity:.65}
  }

  .side-btn{
    display:flex;align-items:center;gap:9px;
    width:100%;padding:10px 12px;
    border:1px solid var(--border-strong);background:#fff;
    border-radius:10px;font-size:13.5px;font-weight:500;color:var(--text);
    cursor:pointer;
    transition:transform .14s var(--ease),background .16s,border-color .16s,box-shadow .16s;
    flex-shrink:0;
  }
  .side-btn:hover{background:#f7f7f8;border-color:#d6d6da}
  .side-btn:active{transform:scale(.975)}
  .side-btn.ghost{border-color:transparent;background:transparent}
  .side-btn.ghost:hover{background:var(--hover)}
  .side-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
  .side-btn.active svg{opacity:1}
  .side-btn svg{flex-shrink:0;opacity:.75}

  .section-label{
    display:flex;align-items:center;justify-content:space-between;
    font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted);font-weight:600;
    padding:16px 4px 6px 10px;
    flex-shrink:0;
  }
  .section-label .mini-btn{
    border:none;background:transparent;
    width:22px;height:22px;border-radius:6px;
    cursor:pointer;color:#8a8a8e;
    display:flex;align-items:center;justify-content:center;
    transition:background .14s,color .14s,transform .12s var(--ease);
  }
  .section-label .mini-btn:hover{background:var(--hover);color:#1a1a1a}
  .section-label .mini-btn:active{transform:scale(.88)}

  .chat-list{
    display:flex;flex-direction:column;gap:2px;
    overflow-y:auto;overflow-x:hidden;
    flex:1;padding-bottom:6px;
    min-height:0;
  }
  .chat-item{
    flex-shrink:0;
    padding:8px 10px;border-radius:8px;
    font-size:13.5px;color:#48484c;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;user-select:none;
    min-width:0;max-width:100%;
    line-height:1.25;
    transition:background .14s,color .14s,transform .12s var(--ease);
    animation:item-in .22s var(--ease) both;
  }
  .chat-item:hover{background:var(--hover)}
  .chat-item:active{transform:scale(.98)}
  .chat-item.active{background:#ececee;color:#1a1a1a;font-weight:500}
  .chat-item .badge-mini{
    font-size:10px;color:#a0a0a5;margin-left:6px;font-weight:500;
  }
  @keyframes item-in{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}

  .sidebar-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:99;
    opacity:0;
    pointer-events:none;
    transition:opacity .28s var(--ease);
  }

  /* ---------- MAIN ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
  .topbar{
    padding:12px 26px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;min-height:56px;
    flex-shrink:0;
  }
  .topbar-left{
    display:flex;align-items:center;gap:8px;
    min-width:0;flex:1;
  }
  .chat-title{
    font-size:14px;font-weight:600;letter-spacing:-.005em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    min-width:0;
  }
  .chat-title .tt-project{
    font-size:10px;color:#a0a0a5;text-transform:uppercase;letter-spacing:.06em;
    margin-left:8px;font-weight:600;
  }

  .icon-btn{
    width:34px;height:34px;flex-shrink:0;
    border:1px solid transparent;border-radius:10px;
    background:transparent;color:#7a7a7e;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .16s,color .16s,border-color .16s,transform .14s var(--ease);
  }
  .icon-btn:hover{background:var(--hover);color:#1a1a1a}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn.open{background:var(--hover);color:#1a1a1a;border-color:var(--border-strong)}

  .hamburger-btn{display:none}
  .project-toggle-btn{display:none}

  .body-area{
    flex:1;display:flex;min-height:0;overflow:hidden;
  }
  .chat-area{
    flex:1;display:flex;flex-direction:column;
    min-width:0;min-height:0;
  }

  .project-side{
    width:46%;min-width:320px;max-width:65%;
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    min-height:0;background:#fcfcfd;
  }
  .project-side[hidden]{display:none !important}

  .project-files-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .project-files-header .lbl{
    font-size:11px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:#8a8a8e;
  }
  .project-files-header .actions{display:flex;gap:4px}
  .project-mini-btn{
    border:1px solid var(--border-strong);background:#fff;
    padding:5px 10px;border-radius:8px;
    font-size:12px;font-weight:500;color:#48484c;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;
    transition:background .14s,border-color .14s,transform .12s var(--ease);
  }
  .project-mini-btn:hover{background:#f7f7f8;border-color:#d6d6da}
  .project-mini-btn:active{transform:scale(.96)}

  .project-files-list{
    max-height:170px;min-height:44px;
    overflow-y:auto;
    border-bottom:1px solid var(--border);
    padding:6px;
    flex-shrink:0;
  }
  .project-files-list:empty::after{
    content:"Файлов пока нет — перетащи или загрузи";
    display:block;
    padding:12px 10px;
    font-size:12px;color:#b0b0b5;text-align:center;
  }
  .pfile{
    display:flex;align-items:center;gap:8px;
    padding:6px 8px;border-radius:6px;
    font-size:13px;color:#48484c;
    cursor:pointer;user-select:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background .14s,color .14s;
  }
  .pfile:hover{background:var(--hover)}
  .pfile.active{background:#e6e6e9;color:#1a1a1a;font-weight:500}
  .pfile .ficon{
    width:16px;height:16px;flex-shrink:0;
    color:#8a8a8e;
  }
  .pfile .fname{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .pfile .fsize{font-size:11px;color:#b0b0b5;flex-shrink:0}

  .project-viewer{
    flex:1;min-height:0;
    overflow:auto;
    background:#fff;
    position:relative;
  }
  .viewer-empty{
    padding:40px 20px;text-align:center;color:#a8a8ad;font-size:13px;
  }
  .viewer-image{
    display:block;max-width:100%;
    padding:16px;
    margin:0 auto;
  }
  .viewer-note{
    padding:16px;
    font-size:13px;color:#8a8a8e;
    text-align:center;
  }
  .code-view{
    display:grid;
    grid-template-columns:auto 1fr;
    min-height:100%;
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.55;
    background:#fff;
  }
  .code-gutter{
    position:sticky;left:0;z-index:2;
    background:#fafafa;
    border-right:1px solid #ececec;
    color:#b0b0b5;
    user-select:none;
    text-align:right;
    padding:12px 10px 12px 14px;
    white-space:pre;
  }
  .code-body{
    margin:0;
    padding:12px 18px 12px 14px;
    white-space:pre;
    overflow:visible;
    background:#fff;
    color:#1a1a1a;
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.55;
  }
  .code-body code{
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.55;
    display:block;
    white-space:pre;
  }

  .messages{
    flex:1;overflow-y:auto;
    padding:28px 26px;
    display:flex;flex-direction:column;gap:14px;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .messages::-webkit-scrollbar,.chat-list::-webkit-scrollbar,
  .blocks::-webkit-scrollbar,.project-files-list::-webkit-scrollbar,
  .project-viewer::-webkit-scrollbar{width:8px}
  .messages::-webkit-scrollbar-thumb,.chat-list::-webkit-scrollbar-thumb,
  .blocks::-webkit-scrollbar-thumb,.project-files-list::-webkit-scrollbar-thumb,
  .project-viewer::-webkit-scrollbar-thumb{
    background:#e4e4e7;border-radius:8px;
  }

  .message{display:flex;animation:msg-in .24s var(--ease) both}
  .message.user{justify-content:flex-end}
  .message.assistant{flex-direction:column;align-items:flex-start}
  @keyframes msg-in{
    from{opacity:0;transform:translateY(10px) scale(.985)}
    to{opacity:1;transform:none}
  }
  .bubble{
    max-width:74%;padding:12px 15px;border-radius:16px;
    font-size:14px;line-height:1.52;
    word-wrap:break-word;min-width:0;
  }
  .message.user .bubble{
    background:var(--bubble-user);color:#fff;
    border-bottom-right-radius:6px;
    white-space:pre-wrap;
  }
  .message.assistant .bubble{
    background:var(--bubble-ai);color:var(--text);
    border-bottom-left-radius:6px;
  }
  .msg-label{
    font-size:10.5px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:#a0a0a5;
    margin-bottom:8px;
  }
  .msg-content{white-space:pre-wrap;line-height:1.55}
  .msg-content:empty{display:none}

  .msg-content .word{
    display:inline-block;
    opacity:0;
    animation:word-in .42s var(--ease) both;
  }
  @keyframes word-in{
    from{opacity:0;transform:translateY(3px);filter:blur(1px)}
    to{opacity:1;transform:none;filter:blur(0)}
  }

  .empty{
    margin:auto;text-align:center;color:var(--muted);
    animation:msg-in .45s var(--ease) both;
    padding:20px;
  }
  .empty .big{
    font-size:22px;font-weight:600;color:#1a1a1a;
    letter-spacing:-.02em;margin-bottom:8px;
  }

  @keyframes block-in{
    from{opacity:0;transform:translateY(8px) scale(.98)}
    to{opacity:1;transform:none}
  }

  .agent-working{
    display:none;align-items:center;gap:8px;
    padding:6px 2px;font-size:12px;color:#a0a0a5;letter-spacing:.02em;
  }
  .agent-working.visible{
    display:flex;animation:block-in .25s var(--ease) both;
  }
  .aw-dots{display:flex;gap:3px}
  .aw-dots span{
    width:4px;height:4px;border-radius:50%;
    background:#b0b0b5;
    animation:tdot 1.3s infinite ease-in-out;
  }
  .aw-dots span:nth-child(2){animation-delay:.18s}
  .aw-dots span:nth-child(3){animation-delay:.36s}
  @keyframes tdot{
    0%,60%,100%{opacity:.35;transform:translateY(0)}
    30%{opacity:1;transform:translateY(-3px)}
  }

  .msg-actions{
    display:flex;gap:2px;
    margin:6px 0 0 4px;
    animation:actions-in .3s var(--ease) both;
    animation-delay:.08s;
  }
  @keyframes actions-in{
    from{opacity:0;transform:translateY(4px)}
    to{opacity:1;transform:none}
  }
  .action-btn{
    width:32px;height:32px;
    border:none;background:transparent;
    border-radius:8px;
    color:#b0b0b5;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .16s,color .16s,transform .14s var(--ease);
  }
  .action-btn:hover{background:#ececee;color:#1a1a1a}
  .action-btn:active{transform:scale(.88)}
  .action-btn.like.active{background:#e4e4e7;color:#1a1a1a}
  .action-btn.dislike.active{background:#fbeaea;color:var(--danger)}
  .action-btn.regen svg{transition:transform .5s var(--ease)}
  .action-btn.regen.spinning svg{animation:regen-spin .55s var(--ease)}
  @keyframes regen-spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }

  .agent-steps{display:flex;flex-direction:column;gap:6px}
  .agent-steps:empty{display:none}

  .reasoning-block{
    margin:2px 0 4px;
    border-left:2px solid #e3e3e7;
    padding-left:12px;
    animation:block-in .28s var(--ease) both;
  }
  .reasoning-head{
    display:inline-flex;align-items:center;gap:7px;
    padding:3px 4px 3px 0;
    background:none;border:none;
    font-family:inherit;
    font-size:11px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;
    color:#a4a4a9;cursor:pointer;
    transition:color .15s;
  }
  .reasoning-head:hover{color:#5a5a5e}
  .reasoning-head .chev{
    width:9px;height:9px;flex-shrink:0;
    transition:transform .28s var(--ease);
    transform-origin:50% 50%;
  }
  .reasoning-block.open .reasoning-head .chev{transform:rotate(90deg)}
  .reasoning-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .3s var(--ease);
  }
  .reasoning-block.open .reasoning-body{grid-template-rows:1fr}
  .reasoning-clip{overflow:hidden;min-height:0}
  .reasoning-text{
    padding:4px 0;
    color:#9a9a9e;font-style:italic;
    font-size:13px;line-height:1.6;
    white-space:pre-wrap;
  }

  /* chips: status / browser / project / computer — общий стиль */
  .status-chip, .browser-chip, .project-chip, .computer-chip{
    display:flex;align-items:center;gap:8px;
    width:fit-content;max-width:100%;
    padding:5px 12px 5px 6px;
    background:#ffffff;
    border:1px solid #e6e6ea;
    border-radius:999px;
    font-size:12.5px;font-weight:500;color:#2e2e32;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
    animation:chip-in .28s var(--ease) both;
  }
  .status-chip .status-mark,
  .browser-chip .browser-mark,
  .project-chip .project-mark,
  .computer-chip .computer-mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;flex-shrink:0;
    border-radius:50%;
    background:#1a1a1a;color:#fff;
  }
  .status-chip .status-mark.fail{background:var(--danger)}
  .browser-chip .browser-mark{background:var(--accent)}
  .project-chip .project-mark{background:#7a5af0}
  .computer-chip .computer-mark{background:var(--computer)}
  .browser-chip.running .browser-mark,
  .project-chip.running .project-mark,
  .computer-chip.running .computer-mark{animation:bpulse 1.4s ease-in-out infinite}
  .browser-chip.fail .browser-mark,
  .project-chip.fail .project-mark,
  .computer-chip.fail .computer-mark{background:var(--danger)}
  .browser-chip.done .browser-mark,
  .project-chip.done .project-mark,
  .computer-chip.done .computer-mark{background:var(--ok)}
  @keyframes bpulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.5;transform:scale(1.15)}
  }
  .status-chip .status-text,
  .browser-chip .status-text,
  .project-chip .status-text,
  .computer-chip .status-text{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .project-chip .path{
    font-family:var(--mono);font-size:11.5px;color:#5a5a5e;
    margin-left:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  @keyframes chip-in{
    from{opacity:0;transform:translateY(4px) scale(.95)}
    to{opacity:1;transform:none}
  }

  .agent-screen{
    display:none;
    margin-top:8px;
    border-radius:12px;
    overflow:hidden;
    background:#f0f0f2;
    border:1px solid #e6e6ea;
    position:relative;
    min-width:240px;
  }
  .agent-screen.visible{display:block}
  .agent-screen.visible.loading{
    display:flex;align-items:center;justify-content:center;
    min-height:120px;
  }
  .agent-screen.visible.loading::after{
    content:"";
    width:20px;height:20px;
    border:2px solid #ddd;
    border-top-color:#666;
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  .agent-screen img{
    display:block;width:100%;max-height:420px;object-fit:contain;
    animation:screen-in .35s var(--ease) both;
  }
  @keyframes screen-in{
    from{opacity:0;transform:scale(.995)}
    to{opacity:1;transform:none}
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .media-block{
    margin:4px 0 0;
    border-radius:12px;overflow:hidden;
    max-width:100%;background:#ececee;
    animation:block-in .3s var(--ease) both;
  }
  .media-block img,
  .media-block video{
    display:block;max-width:100%;max-height:380px;border-radius:12px;
  }
  .media-block video{background:#000}

  /* ---------- COMPOSER ---------- */
  .composer{padding:12px 26px 20px;border-top:1px solid var(--border);flex-shrink:0}
  .composer-row{
    display:flex;align-items:center;gap:8px;margin-bottom:9px;
    flex-wrap:wrap;
  }

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;
    border:1px solid var(--border-strong);background:#fff;
    font-size:12.5px;font-weight:500;color:#48484c;cursor:pointer;
    transition:background .16s,border-color .16s,transform .14s var(--ease);
  }
  .pill:hover{background:#f7f7f8;border-color:#d6d6da}
  .pill:active{transform:scale(.955)}
  .pill .caret{transition:transform .2s var(--ease)}
  .pill.open .caret{transform:rotate(180deg)}
  .pill.small{padding:5px 10px;font-size:12px}
  .pill.small svg{opacity:.7}
  .pill.danger{border-color:#f2c4c4;color:var(--danger)}
  .pill.danger:hover{background:#fbeaea;border-color:#e7a9a9}

  .menu-wrap{position:relative}
  .menu{
    position:absolute;bottom:calc(100% + 8px);left:0;
    background:#fff;border:1px solid var(--border);border-radius:12px;
    box-shadow:0 12px 32px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.04);
    padding:6px;min-width:220px;z-index:30;
    opacity:0;transform:translateY(6px) scale(.96);
    pointer-events:none;transform-origin:bottom left;
    transition:opacity .16s var(--ease),transform .16s var(--ease);
  }
  .menu.open{opacity:1;transform:none;pointer-events:auto}
  .menu.down{
    bottom:auto;top:calc(100% + 8px);
    transform-origin:top right;
    transform:translateY(-6px) scale(.96);
  }
  .menu.down.open{transform:none}
  .menu.align-right{left:auto;right:0}

  .menu-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 10px;border-radius:8px;font-size:13.5px;
    cursor:pointer;transition:background .12s;color:#2a2a2e;
  }
  .menu-item:hover{background:var(--hover)}
  .menu-item.active{background:#f0f0f2;font-weight:600}
  .menu-item.disabled{cursor:default;color:#a5a5aa}
  .menu-item.disabled:hover{background:transparent}
  .menu-item .check{opacity:0;transition:opacity .16s;color:#1a1a1a}
  .menu-item.active .check{opacity:1}
  .badge{
    font-size:10px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:#9a9a9e;
    background:#f3f3f5;padding:2px 7px;border-radius:6px;
  }
  .menu-section-label{
    font-size:10px;font-weight:600;text-transform:uppercase;
    letter-spacing:.07em;color:#a5a5aa;
    padding:6px 10px 4px;
  }
  .menu-sep{height:1px;background:var(--border);margin:6px 4px}

  .attachments-row{
    display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;
  }
  .attachments-row:empty{display:none}
  .attachment-thumb{
    position:relative;
    width:64px;height:64px;
    border-radius:10px;overflow:hidden;
    background:#f0f0f2;
    animation:block-in .24s var(--ease) both;
  }
  .attachment-thumb img,
  .attachment-thumb video{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .attachment-thumb .remove-mini{
    position:absolute;top:4px;right:4px;
    width:20px;height:20px;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff;border:none;
    cursor:pointer;font-size:13px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:background .14s,transform .12s var(--ease);
  }
  .attachment-thumb .remove-mini:hover{background:rgba(0,0,0,.85)}
  .attachment-thumb .remove-mini:active{transform:scale(.88)}

  .input-row{
    display:flex;align-items:flex-end;gap:8px;
    background:#fff;border:1px solid var(--border-strong);
    border-radius:16px;padding:8px 8px 8px 16px;
    transition:border-color .18s,box-shadow .18s;
  }
  .input-row:focus-within{
    border-color:#c9c9cd;
    box-shadow:0 0 0 4px rgba(0,0,0,.03);
  }
  textarea{
    flex:1;border:none;outline:none;resize:none;background:transparent;
    font-family:inherit;font-size:14px;line-height:1.5;
    padding:8px 0;max-height:160px;color:var(--text);
  }
  textarea::placeholder{color:#a8a8ad}

  .send-btn{
    width:36px;height:36px;flex-shrink:0;
    border-radius:11px;border:none;background:#1a1a1a;color:#fff;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .14s var(--ease),background .16s,opacity .16s;
  }
  .send-btn:hover{background:#000}
  .send-btn:active{transform:scale(.9)}
  .send-btn:disabled{opacity:.3;cursor:default;transform:none}

  .styler-row{
    display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;
    animation:styler-in .22s var(--ease) both;
  }
  .styler-row.hidden{display:none}
  @keyframes styler-in{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:none}
  }

  .blocks{
    display:flex;flex-direction:column;gap:6px;
    max-height:260px;overflow-y:auto;
  }
  .blocks:not(:empty){margin-bottom:9px}
  .block{
    display:flex;gap:8px;align-items:flex-start;
    animation:block-in .24s var(--ease) both;
  }
  .block textarea,
  .block input[type="text"],
  .block input[type="url"],
  .block input[type="number"]{
    flex:1;border:1px solid var(--border-strong);border-radius:11px;
    padding:9px 12px;font-family:inherit;font-size:13px;
    outline:none;resize:none;background:#fcfcfd;color:#8a8a8e;
    line-height:1.45;
    transition:border-color .16s,background .16s,box-shadow .16s;
  }
  .block textarea:focus,
  .block input[type="text"]:focus,
  .block input[type="url"]:focus,
  .block input[type="number"]:focus{
    border-color:#c9c9cd;background:#fff;
    box-shadow:0 0 0 4px rgba(0,0,0,.03);
  }
  .block textarea::placeholder,
  .block input::placeholder{color:#b4b4b9}
  .block.reasoning textarea{
    font-style:italic;min-height:52px;color:#8a8a8e;
    border-left:2px solid #e3e3e7;
  }
  .block.status input[type="text"]{color:#2e2e32;font-weight:500}

  .block.status .status-toggle{
    width:22px;height:22px;flex-shrink:0;
    margin-top:7px;border-radius:50%;border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:#fff;
    transition:background .16s, transform .14s var(--ease);
  }
  .block.status .status-toggle.ok{background:#1a1a1a}
  .block.status .status-toggle.fail{background:var(--danger)}
  .block.status .status-toggle:active{transform:scale(.88)}

  .block.browser,
  .block.computer{
    flex-direction:column;align-items:stretch;
    border:1px solid var(--border-strong);border-radius:11px;
    padding:8px;background:#fcfcfd;gap:6px;
  }
  .block.browser .browser-row,
  .block.computer .browser-row{display:flex;gap:8px;align-items:center}
  .block.browser select,
  .block.computer select{
    border:1px solid var(--border-strong);border-radius:8px;
    padding:6px 8px;background:#fff;font-size:12.5px;
    outline:none;font-family:inherit;
  }
  .block.browser .remove,
  .block.computer .remove{margin-top:0}

  .block.media{align-items:center}
  .block.media .media-thumb{
    width:56px;height:56px;border-radius:10px;
    overflow:hidden;flex-shrink:0;
    background:#f0f0f2;border:1px solid var(--border-strong);
  }
  .block.media .media-thumb img,
  .block.media .media-thumb video{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .block.media .media-info{flex:1;min-width:0}
  .block.media .media-name{
    font-size:12.5px;color:#48484c;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .block.media .media-kind{
    font-size:11px;color:#a0a0a5;margin-top:2px;
  }

  .delay-wrap{
    display:flex;align-items:center;gap:3px;
    margin-top:7px;flex-shrink:0;
  }
  .block.media .delay-wrap,
  .block.browser .delay-wrap,
  .block.computer .delay-wrap{margin-top:0}
  .delay-wrap input{
    width:46px;padding:5px 4px;
    border:1px solid var(--border-strong);border-radius:8px;
    font-family:inherit;font-size:12px;text-align:center;
    background:#fcfcfd;color:#48484c;outline:none;
    transition:border-color .16s,background .16s;
    -moz-appearance:textfield;
  }
  .delay-wrap input::-webkit-outer-spin-button,
  .delay-wrap input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .delay-wrap input:focus{border-color:#c9c9cd;background:#fff}
  .delay-wrap span{font-size:11px;color:#a0a0a5}

  .block .remove{
    width:28px;height:28px;flex-shrink:0;
    border:none;background:transparent;border-radius:8px;
    cursor:pointer;color:#b0b0b5;font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    margin-top:5px;
    transition:background .14s,color .14s,transform .12s var(--ease);
  }
  .block.media .remove{margin-top:0}
  .block .remove:hover{background:#f2f2f4;color:#1a1a1a}
  .block .remove:active{transform:scale(.88)}

  .project-side.dragover{
    background:#f2f5ff;
    outline:2px dashed var(--accent);
    outline-offset:-8px;
  }

  /* индикатор «ПК включён» */
  .pc-on-indicator{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;color:var(--computer);
    padding:3px 8px;border-radius:999px;
    background:#e8f6ee;border:1px solid #c7e6d4;
  }
  .pc-on-indicator .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--computer);
    animation:pulse 1.6s ease-in-out infinite;
  }


  /* ---------- BRAND ---------- */
  .brand{gap:8px}
  .brand-name{display:inline-flex}
  .brand-name .bl{
    display:inline-block;
    opacity:0;
    animation:brand-letter .62s var(--ease) both;
  }
  @keyframes brand-letter{
    0%{opacity:0;transform:translateY(10px) rotate(-12deg) scale(.7);filter:blur(4px)}
    60%{opacity:1;transform:translateY(-2px) rotate(2deg) scale(1.06);filter:blur(0)}
    100%{opacity:1;transform:none}
  }
  .brand-ai{
    font-weight:700;
    background:linear-gradient(100deg,#2f7fe8 0%,#7fc4ff 25%,#bfe4ff 45%,#4aa3f0 65%,#2f7fe8 100%);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:ai-flow 3.6s linear infinite, ai-pop .5s var(--ease) both;
    animation-delay:0s, .5s;
  }
  @keyframes ai-flow{
    0%{background-position:0% 50%}
    100%{background-position:300% 50%}
  }
  @keyframes ai-pop{
    from{opacity:0;transform:translateX(-6px) scale(.8)}
    to{opacity:1;transform:none}
  }

  /* ---------- SHINE «работаю» ---------- */
  .aw-text{
    background:linear-gradient(100deg,#c2c2c8 0%,#c2c2c8 35%,#f4f4f6 50%,#c2c2c8 65%,#c2c2c8 100%);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:shine 1.9s linear infinite;
    font-weight:500;
  }
  @keyframes shine{
    from{background-position:120% 50%}
    to{background-position:-40% 50%}
  }

  /* ---------- SIDEBAR CHATS ---------- */
  .chat-item{
    display:flex;align-items:center;gap:6px;
    position:relative;
  }
  .chat-item .ci-main{
    display:flex;align-items:center;gap:6px;
    min-width:0;flex:1;overflow:hidden;
  }
  .chat-item .ci-title{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }
  .chat-item .ci-pin{
    flex-shrink:0;color:#9a9a9e;display:flex;
  }
  .chat-label{
    flex-shrink:0;
    font-size:9.5px;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;
    padding:2px 6px;border-radius:5px;
    background:#e8eefc;color:#3a63b8;
    max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    animation:block-in .22s var(--ease) both;
  }
  .chat-item .ci-menu{
    flex-shrink:0;
    width:22px;height:22px;border:none;background:transparent;
    border-radius:6px;color:#a0a0a5;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .14s,background .14s,color .14s,transform .12s var(--ease);
  }
  .chat-item:hover .ci-menu,.chat-item.active .ci-menu,.chat-item .ci-menu.open{opacity:1}
  .chat-item .ci-menu:hover{background:#e2e2e6;color:#1a1a1a}
  .chat-item .ci-menu:active{transform:scale(.88)}

  .ctx-menu{
    position:fixed;z-index:200;
    background:#fff;border:1px solid var(--border);border-radius:12px;
    box-shadow:0 14px 40px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.05);
    padding:6px;min-width:208px;
    opacity:0;transform:translateY(-6px) scale(.96);
    transform-origin:top left;
    transition:opacity .16s var(--ease),transform .16s var(--ease);
    pointer-events:none;
    max-height:70vh;overflow:auto;
  }
  .ctx-menu.open{opacity:1;transform:none;pointer-events:auto}
  .ctx-menu .menu-item.danger{color:var(--danger)}
  .ctx-menu .menu-item.danger:hover{background:#fbeaea}
  .ctx-menu .dot-color{
    width:8px;height:8px;border-radius:50%;background:#3a63b8;flex-shrink:0;
  }
  .ctx-menu .menu-item .left{display:flex;align-items:center;gap:8px;min-width:0}

  /* ---------- MARKDOWN ---------- */
  .msg-content.md{white-space:normal}
  .msg-content.md > *:first-child{margin-top:0}
  .msg-content.md > *:last-child{margin-bottom:0}
  .msg-content.md p{margin:0 0 8px;line-height:1.55}
  .msg-content.md h1,.msg-content.md h2,.msg-content.md h3{
    margin:12px 0 6px;line-height:1.3;letter-spacing:-.01em;font-weight:650;
  }
  .msg-content.md h1{font-size:18px}
  .msg-content.md h2{font-size:16px}
  .msg-content.md h3{font-size:14.5px}
  .msg-content.md ul,.msg-content.md ol{margin:0 0 8px;padding-left:20px}
  .msg-content.md li{margin:2px 0;line-height:1.5}
  .msg-content.md blockquote{
    margin:0 0 8px;padding:4px 12px;
    border-left:3px solid #d8d8dd;color:#5a5a5f;
  }
  .msg-content.md code.inline{
    font-family:var(--mono);font-size:.88em;
    background:rgba(0,0,0,.055);padding:1.5px 5px;border-radius:5px;
  }
  .message.user .msg-content.md code.inline{background:rgba(255,255,255,.18)}
  .msg-content.md hr{border:none;border-top:1px solid var(--border-strong);margin:10px 0}
  .msg-content.md a{color:var(--accent);text-decoration:underline}
  .msg-content.md strong{font-weight:650}
  .msg-content.md table{border-collapse:collapse;margin:0 0 8px;font-size:13px;display:block;overflow-x:auto}
  .msg-content.md th,.msg-content.md td{border:1px solid var(--border-strong);padding:5px 9px;text-align:left}
  .msg-content.md th{background:#f0f0f2;font-weight:600}

  .code-card{
    margin:0 0 9px;border:1px solid var(--border-strong);
    border-radius:10px;overflow:hidden;background:#fbfbfc;
    animation:block-in .24s var(--ease) both;
  }
  .code-card .cc-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 8px 5px 11px;
    background:#f3f3f5;border-bottom:1px solid var(--border);
    font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:#8a8a8e;font-weight:600;
  }
  .code-card pre{
    margin:0;padding:11px 13px;overflow-x:auto;
    font-family:var(--mono);font-size:12.5px;line-height:1.55;
  }
  .code-card code{font-family:var(--mono);background:none;padding:0}
  .cc-copy{
    border:none;background:transparent;cursor:pointer;
    font-size:11px;color:#8a8a8e;padding:3px 7px;border-radius:6px;
    text-transform:none;letter-spacing:0;font-weight:500;
    transition:background .14s,color .14s;
  }
  .cc-copy:hover{background:#e6e6e9;color:#1a1a1a}
  .cc-copy.done{color:var(--ok)}

  .action-btn.copy.done{color:var(--ok);background:#eaf6ea}
  .action-btn.copy svg{transition:transform .2s var(--ease)}
  .action-btn.copy.done svg{transform:scale(1.12)}

  /* индикатор ПК внутри меню чата */
  .menu-item .pc-dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;
    background:#c9c9ce;transition:background .2s;
  }
  .menu-item .pc-dot.on{
    background:var(--computer);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .menu-item .pc-state{font-size:11px;color:#a0a0a5;font-weight:600}
  .menu-item .pc-state.on{color:var(--computer)}


  /* ---------- MIC / STOP ---------- */
  .mic-btn{
    width:38px;height:38px;flex-shrink:0;
    border:1px solid var(--border-strong);border-radius:12px;
    background:#fff;color:#7a7a7e;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .16s,color .16s,border-color .16s,transform .14s var(--ease),box-shadow .2s;
  }
  .mic-btn:hover{background:#f7f7f8;color:#1a1a1a}
  .mic-btn:active{transform:scale(.92)}
  .mic-btn.listening{
    background:#fdeaea;border-color:#f0bcbc;color:var(--danger);
    box-shadow:0 0 0 0 rgba(220,76,76,.45);
    animation:mic-pulse 1.4s infinite;
  }
  .mic-btn.unsupported{opacity:.4;cursor:not-allowed}
  @keyframes mic-pulse{
    0%{box-shadow:0 0 0 0 rgba(220,76,76,.40)}
    70%{box-shadow:0 0 0 10px rgba(220,76,76,0)}
    100%{box-shadow:0 0 0 0 rgba(220,76,76,0)}
  }

  .send-btn.stop{background:var(--danger)}
  .send-btn.stop:hover{background:#c73f3f}

  .voice-hint{
    font-size:11px;color:var(--danger);font-weight:600;
    padding:2px 0 4px;letter-spacing:.02em;
    animation:block-in .2s var(--ease) both;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;z-index:300;
    background:rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    opacity:0;transition:opacity .22s var(--ease);
  }
  .modal-overlay.open{opacity:1}
  .modal-overlay[hidden]{display:none}
  .modal{
    width:min(620px,100%);max-height:80vh;
    background:#fff;border-radius:16px;
    border:1px solid var(--border);
    box-shadow:0 24px 60px rgba(0,0,0,.18);
    display:flex;flex-direction:column;
    padding:14px 16px 14px;
    transform:translateY(12px) scale(.98);
    transition:transform .24s var(--ease);
  }
  .modal-overlay.open .modal{transform:none}
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:15px;font-weight:600;margin-bottom:4px;
  }
  .modal-hint{font-size:11px;color:#a0a0a5;margin-bottom:10px;word-break:break-all}
  .modal textarea{
    flex:1;min-height:240px;resize:vertical;
    border:1px solid var(--border-strong);border-radius:10px;
    padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;
    outline:none;background:#fcfcfd;color:#1a1a1a;
    transition:border-color .16s,background .16s;
  }
  .modal textarea:focus{border-color:#c9c9cd;background:#fff}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
  .pill.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
  .pill.primary:hover{background:#000}

  .empty .big .brand-ai{font-size:inherit}

  @media (max-width: 900px) {
    body { font-size: 15px; }

    .sidebar{
      position:fixed;
      top:0;left:0;
      height:100vh;height:100dvh;
      width:280px;max-width:82vw;
      z-index:100;
      transform:translateX(-105%);
      transition:transform .3s var(--ease);
      box-shadow:0 0 40px rgba(0,0,0,.12);
      padding-top:max(16px, env(safe-area-inset-top));
    }
    .sidebar.open{transform:translateX(0)}
    .sidebar-overlay{display:block}
    .sidebar-overlay.open{opacity:1;pointer-events:auto}

    .topbar{
      padding:10px 14px;
      padding-top:max(10px, env(safe-area-inset-top));
      min-height:54px;gap:8px;
    }
    .hamburger-btn{display:flex}
    .project-toggle-btn{display:flex}

    .messages{padding:16px 12px;gap:12px}
    .bubble{max-width:92%;font-size:15px;line-height:1.5;padding:10px 13px;border-radius:14px}

    .action-btn{width:36px;height:36px}
    .msg-actions{margin-left:0}

    .agent-screen img{max-height:55vh}
    .media-block img,.media-block video{max-height:55vh}

    .composer{padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
    .composer-row{
      gap:6px;margin-bottom:6px;flex-wrap:nowrap;
      overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding-bottom:2px;
    }
    .composer-row::-webkit-scrollbar{display:none}
    .composer-row > *{flex-shrink:0}
    .pill{font-size:12px;padding:7px 11px;min-height:34px}
    .pill.small{padding:6px 10px;font-size:11.5px;min-height:30px}

    .styler-row{
      flex-wrap:nowrap;overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;margin-bottom:6px;padding-bottom:2px;
    }
    .styler-row::-webkit-scrollbar{display:none}
    .styler-row > *{flex-shrink:0}

    textarea{font-size:16px;padding:8px 0;max-height:130px}
    input[type="text"],input[type="url"],input[type="number"]{font-size:16px}

    .send-btn{width:40px;height:40px;border-radius:12px}
    .mic-btn{width:40px;height:40px;border-radius:12px}
    .modal{padding:12px;max-height:88vh}
    .modal textarea{min-height:180px;font-size:13px}

    .menu{min-width:200px;max-width:calc(100vw - 20px)}
    .menu.down{right:0;left:auto}
    .menu-item{padding:11px 12px;font-size:14px}

    .blocks{max-height:40vh}
    .block.status .status-toggle{width:28px;height:28px;margin-top:5px}
    .block .remove{width:34px;height:34px;font-size:18px}
    .block textarea,.block input[type="text"],.block input[type="url"]{font-size:14px}
    .delay-wrap input{font-size:13px;width:50px;padding:6px 4px}
    .agent-screen{min-width:0;margin-top:6px}
    .sidebar-overlay{position:fixed}

    .project-side{
      position:fixed;
      top:0;left:0;
      width:100%;height:100vh;height:100dvh;
      max-width:100%;min-width:0;
      z-index:98;
      transform:translateX(-105%);
      transition:transform .3s var(--ease);
      padding-top:max(0px, env(safe-area-inset-top));
      box-shadow:0 0 40px rgba(0,0,0,.12);
    }

function brandLetters(el, text, step = 70, base = 0) {
  if (!el) return;
  el.innerHTML = "";
  [...text].forEach((ch, i) => {
    const sp = document.createElement("span");
    sp.className = "bl";
    sp.textContent = ch;
    sp.style.animationDelay = (base + i * step) + "ms";
    el.appendChild(sp);
  });
}

function animateBrand() {
  brandLetters($("brand-name"), "Zimple");
}

/* Большой логотип на пустом экране — те же буквы + градиентное AI */
function buildBigBrand() {
  const wrap = document.createElement("div");
  wrap.className = "big";
  const name = document.createElement("span");
  name.className = "brand-name";
  const ai = document.createElement("span");
  ai.className = "brand-ai";
  ai.textContent = "AI";
  ai.style.animationDelay = "0s, .46s";
  wrap.appendChild(name);
  wrap.appendChild(document.createTextNode(" "));
  wrap.appendChild(ai);
  brandLetters(name, "Zimple", 62);
  return wrap;
}

function isMobile() { return window.matchMedia("(max-width: 900px)").matches; }

function sanitizeTitle(t) {
  if (t == null) return "Новый чат";
  t = String(t).replace(/[\u0000-\u001F\u007F-\u009F\u200B-\u200F\u2028-\u202F\uFFFD]/g, " ");
  t = t.replace(/\s+/g, " ").trim();
  if (t.length > 60) t = t.slice(0, 57).trim() + "...";
  return t || "Новый чат";
}

function formatSize(bytes) {
  if (!bytes) return "0 Б";
  const units = ["Б", "КБ", "МБ", "ГБ"];
  let i = 0, n = bytes;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return n < 10 && i > 0 ? n.toFixed(1) + " " + units[i] : Math.round(n) + " " + units[i];
}

function extOf(path) {
  const m = String(path).toLowerCase().match(/\.([a-z0-9]+)$/);
  return m ? m[1] : "";
}

function langFor(path) {
  const ext = extOf(path);
  if (LANG_BY_EXT[ext]) return LANG_BY_EXT[ext];
  const name = String(path).toLowerCase();
  if (name === "dockerfile") return "dockerfile";
  if (name === "makefile") return "makefile";
  if (name.startsWith(".git")) return "ini";
  return null;
}

function deviceId() {
  try { return localStorage.getItem("zimple_device") || ""; }
  catch (e) { return ""; }
}

async function initDevice() {
  if (deviceId()) return;
  try {
    const res = await fetch("/api/device");
    const data = await res.json();
    if (data && data.device_id) localStorage.setItem("zimple_device", data.device_id);
  } catch (e) { console.warn("device id:", e); }
}

async function api(url, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  const dev = deviceId();
  if (dev) headers["X-Zimple-Device"] = dev;
  const signal = opts.signal || (state.abort ? state.abort.signal : undefined);
  const res = await fetch(url, { ...opts, headers, signal });
  if (!res.ok) {
    let body = null;
    try { body = await res.json(); } catch (e) {}
    const err = new Error("API error " + res.status);
    err.body = body;
    throw err;
  }
  return res.json();
}

async function uploadFile(file) {
  const fd = new FormData();
  fd.append("file", file);
  const dev = deviceId();
  const res = await fetch("/api/upload", {
    method: "POST", body: fd,
    headers: dev ? { "X-Zimple-Device": dev } : {},
  });
  if (!res.ok) throw new Error("upload failed " + res.status);
  return res.json();
}

function autoResize() {
  if (!inputEl) return;
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}

function renderError(e) {
  const wrap = document.createElement("div");
  wrap.className = "message assistant";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const content = document.createElement("div");
  content.className = "msg-content";

  let text = "Ошибка";
  try {
    if (e && e.body && typeof e.body === "object") {
      text = e.body.error || "Ошибка";
      if (e.body.detail) text += ": " + e.body.detail;
    } else if (e && e.message) {
      text = e.message;
    }
  } catch (_) {}

  content.textContent = text;
  bubble.appendChild(content);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollBottom();
}

function buildChatItem(c) {
  const el = document.createElement("div");
  el.className = "chat-item" + (c.id === state.currentId && state.view === "chat" ? " active" : "");

  const main = document.createElement("div");

    pin.innerHTML = SVG_PIN;
    main.appendChild(pin);
  }

  const title = document.createElement("span");
  title.className = "ci-title";
  title.textContent = sanitizeTitle(c.title);
  main.appendChild(title);
  el.title = sanitizeTitle(c.title);

  if (c.label) {
    const lb = document.createElement("span");
    lb.className = "chat-label";
    lb.textContent = c.label;
    main.appendChild(lb);
  }

  };

}

function closeCtxMenu() {
  const m = document.getElementById("ctx-menu");
  if (m) { m.classList.remove("open"); setTimeout(() => m.remove(), 180); }
  document.querySelectorAll(".ci-menu.open").forEach(b => b.classList.remove("open"));
}

function ctxItem(text, opts = {}) {
  const it = document.createElement("div");
  it.className = "menu-item" + (opts.danger ? " danger" : "") + (opts.active ? " active" : "");
  const left = document.createElement("span");
  left.className = "left";
  if (opts.dot) {
    const d = document.createElement("span");
    d.className = "dot-color";
    left.appendChild(d);
  }
  const sp = document.createElement("span");
  sp.textContent = text;
  left.appendChild(sp);
  it.appendChild(left);
  if (opts.active) {
    const chk = document.createElement("span");
    chk.innerHTML = SVG_CHECK;
    it.appendChild(chk);
  }
  if (opts.onClick) it.onclick = (e) => { e.stopPropagation(); opts.onClick(); };

}

function openChatContextMenu(c, anchor) {
  closeCtxMenu();
  closeMenus();
  anchor.classList.add("open");

  const menu = document.createElement("div");
  menu.id = "ctx-menu";
  menu.className = "ctx-menu";
  menu.onclick = (e) => e.stopPropagation();

  menu.appendChild(ctxItem(c.pinned ? "Открепить" : "Закрепить", {
    onClick: async () => { closeCtxMenu(); await patchChat(c.id, { pinned: !c.pinned }); },
  }));

  const sep = document.createElement("div");
  sep.className = "menu-sep";
  menu.appendChild(sep);

  const lbl = document.createElement("div");
  lbl.className = "menu-section-label";
  lbl.textContent = "Метка";
  menu.appendChild(lbl);

  for (const name of state.labels) {
    menu.appendChild(ctxItem(name, {
      dot: true,
      active: c.label === name,
      onClick: async () => {
        closeCtxMenu();
        await patchChat(c.id, { label: c.label === name ? null : name });
      },
    }));
  }

  if (c.label) {
    menu.appendChild(ctxItem("Снять метку", {
      onClick: async () => { closeCtxMenu(); await patchChat(c.id, { label: null }); },
    }));
  }

  menu.appendChild(ctxItem("Добавить свой…", {
    onClick: async () => {
      closeCtxMenu();
      const name = prompt("Название метки:", "");
      if (!name || !name.trim()) return;
      const clean = name.trim().slice(0, 24);
      try {
        state.labels = await api("/api/labels", {
          method: "POST",
          body: JSON.stringify({ name: clean }),
        });
      } catch (e) { console.error(e); }
      await patchChat(c.id, { label: clean });
    },
  }));

  const sep2 = document.createElement("div");
  sep2.className = "menu-sep";
  menu.appendChild(sep2);

  menu.appendChild(ctxItem("Переименовать", {
    onClick: async () => {
      closeCtxMenu();
      const t = prompt("Название чата:", sanitizeTitle(c.title));
      if (t === null) return;
      await patchChat(c.id, { title: t });
      if (state.currentId === c.id) titleEl.textContent = sanitizeTitle(t);
    },
  }));

  menu.appendChild(ctxItem("Удалить", {
    danger: true,
    onClick: async () => {
      closeCtxMenu();
      if (!confirm("Удалить чат «" + sanitizeTitle(c.title) + "»?")) return;
      await deleteChat(c.id);
    },
  }));

  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  const w = menu.offsetWidth || 208;
  const h = menu.offsetHeight || 260;
  let left = Math.min(r.left, window.innerWidth - w - 10);
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 10) top = Math.max(10, r.top - h - 6);
  menu.style.left = Math.max(10, left) + "px";
  menu.style.top = top + "px";
  requestAnimationFrame(() => menu.classList.add("open"));
}

async function deleteChat(id) {

function renderList() {
  chatListEl.innerHTML = "";

  if (state.listMode === "chats") {
    if (!state.chats.length) {
      const hint = document.createElement("div");
      hint.className = "chat-item";
      hint.style.color = "#b0b0b5";
      hint.style.cursor = "default";
      hint.textContent = "Пока пусто";
      chatListEl.appendChild(hint);
      return;
    }
    for (const c of state.chats) {
      chatListEl.appendChild(buildChatItem(c));
    }
    return;
  }

  if (!state.projects.length) {
    const hint = document.createElement("div");
    hint.className = "chat-item";
    hint.style.color = "#b0b0b5";
    hint.style.cursor = "default";
    hint.textContent = "Нет проектов";

    return;

async function openProjectFile(path) {
  state.currentFilePath = path;
  document.querySelectorAll(".pfile").forEach((el) => {
    el.classList.toggle("active", el.title === path);
  });

  const viewer = $("project-viewer");
  viewer.innerHTML = `<div class="viewer-empty">Загрузка…</div>`;

  try {
    const res = await api(
      `/api/projects/${state.currentProjectId}/file?path=${encodeURIComponent(path)}`
    );
    renderProjectViewer(res);
  } catch (e) {
    viewer.innerHTML = `<div class="viewer-note">Ошибка загрузки файла</div>`;
  }
}

function renderProjectViewer(data) {
  const viewer = $("project-viewer");
  viewer.innerHTML = "";

  if (!data) {
    const empty = document.createElement("div");
    empty.className = "viewer-empty";
    empty.textContent = "Выбери файл, чтобы посмотреть содержимое";
    viewer.appendChild(empty);
    return;
  }

  if (data.kind === "image") {
    const img = document.createElement("img");
    img.src = `/api/projects/${state.currentProjectId}/file?path=${encodeURIComponent(data.path)}&raw=1`;
    img.className = "viewer-image";
    viewer.appendChild(img);
    return;
  }

  if (data.kind === "video") {
    const v = document.createElement("video");
    v.src = `/api/projects/${state.currentProjectId}/file?path=${encodeURIComponent(data.path)}&raw=1`;
    v.controls = true;
    v.playsInline = true;
    v.style.maxWidth = "100%";
    v.style.padding = "16px";
    viewer.appendChild(v);
    return;
  }

  if (data.kind === "binary") {
    const note = document.createElement("div");
    note.className = "viewer-note";
    note.textContent = "Бинарный файл — просмотр недоступен";
    viewer.appendChild(note);
    return;
  }

  const content = String(data.content ?? "");
  const lines = content.split("\n");
  const wrapper = document.createElement("div");
  wrapper.className = "code-view";

  const gutter = document.createElement("div");
  gutter.className = "code-gutter";
  let numbersText = "";
  for (let i = 1; i <= lines.length; i++) {
    numbersText += i + "\n";
  }
  gutter.textContent = numbersText.trimEnd();
  wrapper.appendChild(gutter);

  const pre = document.createElement("pre");
  pre.className = "code-body";
  const code = document.createElement("code");
  const lang = langFor(data.path);
  const canHl = lang && window.hljs && hljs.getLanguage && hljs.getLanguage(lang);
  if (canHl) {
    try {
      code.innerHTML = hljs.highlight(content, { language: lang, ignoreIllegals: true }).value;
    } catch (e) {
      code.textContent = content;
    }
  } else {
    code.textContent = content;
  }
  pre.appendChild(code);
  wrapper.appendChild(pre);
  viewer.appendChild(wrapper);
}

async function uploadProjectFiles(fileList) {
  if (!state.currentProjectId || !fileList || !fileList.length) return;
  const fd = new FormData();
  for (const f of fileList) {
    const rel = f.webkitRelativePath || f.name;
    fd.append("files", f, rel);
  }
  const res = await fetch(`/api/projects/${state.currentProjectId}/upload`, {
    method: "POST",
    body: fd,
  });
  if (!res.ok) {
    console.error("upload failed", await res.text().catch(() => ""));
    return;
  }
  await refreshProjectFiles();
}

function escHtml(t) {
  return String(t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* Инлайн-разметка: `код`, **жирный**, *курсив*, ~~зачёркнутый~~, ссылки */
function mdInline(src) {
  let t = escHtml(src);
  const codes = [];
  t = t.replace(/`([^`\n]+)`/g, (m, c) => {
    codes.push(c);
    return "\u0000" + (codes.length - 1) + "\u0000";
  });
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/(^|[\s(])((?:https?:\/\/)[^\s<)]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  t = t.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, "$1<em>$2</em>");
  t = t.replace(/(^|[^_\w])_([^_\n]+)_(?![_\w])/g, "$1<em>$2</em>");
  t = t.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  t = t.replace(/\u0000(\d+)\u0000/g,
    (m, i) => '<code class="inline">' + escHtml(codes[+i]) + "</code>");
  return t;
}
