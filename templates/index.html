/* Блочный markdown → DOM */
function renderMarkdown(text) {
  const root = document.createElement("div");
  const lines = String(text).replace(/\r\n/g, "\n").split("\n");
  let i = 0;
  let para = [];

  const flushPara = () => {
    if (!para.length) return;
    const p = document.createElement("p");
    p.innerHTML = mdInline(para.join("\n")).replace(/\n/g, "<br>");
    root.appendChild(p);
    para = [];
  };

  while (i < lines.length) {
    const line = lines[i];

    const fence = line.match(/^\s*```\s*([a-zA-Z0-9+#_-]*)\s*$/);
    if (fence) {
      flushPara();
      const lang = (fence[1] || "").toLowerCase();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      root.appendChild(makeCodeCard(lang, buf.join("\n")));
      continue;
    }

    const head = line.match(/^(#{1,3})\s+(.*)$/);
    if (head) {
      flushPara();
      const h = document.createElement("h" + head[1].length);
      h.innerHTML = mdInline(head[2]);
      root.appendChild(h);
      i++; continue;
    }

    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
      flushPara();
      root.appendChild(document.createElement("hr"));
      i++; continue;
    }

    if (/^\s*>\s?/.test(line)) {
      flushPara();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      const bq = document.createElement("blockquote");
      bq.innerHTML = mdInline(buf.join("\n")).replace(/\n/g, "<br>");
      root.appendChild(bq);
      continue;
    }

    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      flushPara();
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const list = document.createElement(ordered ? "ol" : "ul");
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        const isOrd = /^\s*\d+[.)]\s+/.test(lines[i]);
        if (isOrd !== ordered) break;
        const li = document.createElement("li");
        li.innerHTML = mdInline(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
        list.appendChild(li);
        i++;
      }
      root.appendChild(list);
      continue;
    }

    if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      flushPara();
      const rows = [];
      const split = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(x => x.trim());
      const header = split(line);
      i += 2;
      while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) { rows.push(split(lines[i])); i++; }
      const table = document.createElement("table");
      const thead = document.createElement("tr");
      header.forEach(h => {
        const th = document.createElement("th");
        th.innerHTML = mdInline(h);
        thead.appendChild(th);
      });
      table.appendChild(thead);
      rows.forEach(r => {
        const tr = document.createElement("tr");
        r.forEach(cell => {
          const td = document.createElement("td");
          td.innerHTML = mdInline(cell);
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      root.appendChild(table);
      continue;
    }

    if (!line.trim()) { flushPara(); i++; continue; }

    para.push(line);
    i++;
  }
  flushPara();
  return root;
}

/* Пословная анимация появления — только для текстовых узлов */
function animateWordsIn(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) =>
      n.parentElement && n.parentElement.closest("pre, code")
        ? NodeFilter.FILTER_REJECT
        : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  let wordIndex = 0;
  for (const node of nodes) {
    const tokens = node.nodeValue.split(/(\s+)/);
    const frag = document.createDocumentFragment();
    for (const tok of tokens) {
      if (!tok) continue;
      if (/^\s+$/.test(tok)) { frag.appendChild(document.createTextNode(tok)); continue; }
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = tok;
      span.style.animationDelay = Math.min(wordIndex * 16, 1600) + "ms";
      frag.appendChild(span);
      wordIndex++;
    }
    node.parentNode.replaceChild(frag, node);
  }
}

function buildTextElement(text, animateWords) {
  const el = document.createElement("div");
  el.className = "msg-content md";
  const rendered = renderMarkdown(text);
  while (rendered.firstChild) el.appendChild(rendered.firstChild);
  if (animateWords) animateWordsIn(el);
  return el;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      return true;
    } catch (_) { return false; }
  }
}

function flashCopy(btn) {
  const prev = btn.innerHTML;
  btn.innerHTML = SVG_CHECK_BIG;
  btn.classList.add("done");
  setTimeout(() => { btn.innerHTML = prev; btn.classList.remove("done"); }, 1500);
}
function makeActionBtn(svg, title, cls) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "action-btn " + cls;
  b.title = title;
  b.innerHTML = svg;
  return b;
}

function updateActionsUI(row, m) {
  const like = row.querySelector(".action-btn.like");
  const dislike = row.querySelector(".action-btn.dislike");
  if (like) like.classList.toggle("active", m.liked === "up");
  if (dislike) dislike.classList.toggle("active", m.liked === "down");
}

function makeActions(m) {
  const row = document.createElement("div");
  row.className = "msg-actions";
  const likeBtn = makeActionBtn(SVG_LIKE, "Нравится", "like");
  const dislikeBtn = makeActionBtn(SVG_DISLIKE, "Не нравится", "dislike");
  const regenBtn = makeActionBtn(SVG_REGEN, "Перегенерировать", "regen");
  const copyBtn = makeActionBtn(SVG_COPY, "Копировать", "copy");
  copyBtn.onclick = async (e) => {
    e.stopPropagation();
    const el = document.querySelector(`.message[data-mid="${m.id}"] .msg-content`);
    const text = m.content || (el ? el.innerText : "");
    if (await copyText(text)) flashCopy(copyBtn);
  };
  row.appendChild(copyBtn);
  row.appendChild(likeBtn);
  row.appendChild(dislikeBtn);
  row.appendChild(regenBtn);
  updateActionsUI(row, m);
  likeBtn.onclick = (e) => { e.stopPropagation(); toggleLike(m, "up", row); };
  dislikeBtn.onclick = (e) => { e.stopPropagation(); toggleLike(m, "down", row); };
  regenBtn.onclick = (e) => {
    e.stopPropagation();
    regenBtn.classList.remove("spinning");
    void regenBtn.offsetWidth;
    regenBtn.classList.add("spinning");
    setTimeout(() => regenBtn.classList.remove("spinning"), 620);
    regenerateMessage(m);
  };
  return row;
}

async function toggleLike(m, direction, row) {
  const next = m.liked === direction ? null : direction;
  m.liked = next;
  updateActionsUI(row, m);
  try {
    await api(`/api/chats/${state.currentId}/messages/${m.id}`, {
      method: "PATCH",
      body: JSON.stringify({ liked: next }),
    });
  } catch (e) { console.error(e); }
}

function regenerateMessage(m) {
  const el = document.querySelector(`.message[data-mid="${m.id}"]`);
  if (!el) return;
  const parent = el.parentNode;
  const next = el.nextSibling;
  el.remove();
  const newEl = buildMessage(m, {});
  parent.insertBefore(newEl, next);
  scrollBottom();
}

function createAssistantShell(m) {
  const wrap = document.createElement("div");
  wrap.className = "message assistant";
  wrap.dataset.mid = m.id;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (m.model) {
    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = m.model;
    bubble.appendChild(label);
  }

  const stepsEl = document.createElement("div");
  stepsEl.className = "agent-steps";
  bubble.appendChild(stepsEl);

  const working = document.createElement("div");
  working.className = "agent-working";
  working.innerHTML = `
    <div class="aw-dots"><span></span><span></span><span></span></div>
    <span class="aw-text">работаю</span>
  `;
  bubble.appendChild(working);

  const screenEl = document.createElement("div");
  screenEl.className = "agent-screen";
  bubble.appendChild(screenEl);

  const contentEl = document.createElement("div");
  contentEl.className = "msg-content";
  contentEl.style.display = "none";
  bubble.appendChild(contentEl);

  wrap.appendChild(bubble);
  wrap.appendChild(makeActions(m));

  wrap._stepsEl = stepsEl;
  wrap._screenEl = screenEl;
  wrap._contentEl = contentEl;
  wrap._workingEl = working;

  return wrap;
}

function setWorking(msgEl, on) {
  if (!msgEl || !msgEl._workingEl) return;
  msgEl._workingEl.classList.toggle("visible", !!on);
}

function updateScreenshot(msgEl, url) {
  const screenEl = msgEl._screenEl;
  if (!screenEl) return;
  screenEl.classList.remove("loading");
  screenEl.classList.add("visible");
  const old = screenEl.querySelector("img");
  const img = document.createElement("img");
  img.src = url;
  img.alt = "";
  if (old) screenEl.replaceChild(img, old);
  else screenEl.appendChild(img);
}

function showScreenshotLoading(msgEl) {
  const screenEl = msgEl._screenEl;
  if (!screenEl) return;
  if (screenEl.querySelector("img")) return;
  screenEl.classList.add("visible", "loading");
}

async function runBrowserAction(chipEl, msgEl, block, blockIndex) {
  chipEl.classList.add("running");
  showScreenshotLoading(msgEl);
  const action = {
    action: block.action,
    url: block.url,
    selector: block.selector,
    value: block.value,
    key: block.key,
    dy: block.dy,
    seconds: block.seconds,
    wait_until: block.wait_until,
  };
  try {
    const res = await api("/api/browser/exec", {
      method: "POST",
      body: JSON.stringify({
        cid: state.currentId,
        mid: msgEl.dataset.mid,
        bidx: blockIndex,
        action,
      }),
    });
    chipEl.classList.remove("running");
    if (res.downloads && res.downloads.length) {
      block.downloads = res.downloads;
      for (const d of res.downloads) {
        if (!d || !d.path) continue;
        const p = document.createElement("span");
        p.className = "path";
        p.textContent = d.path;
        chipEl.appendChild(p);
      }
    }
    if (res.screenshot) {
      chipEl.classList.add("done");
      block.screenshot = res.screenshot;
      updateScreenshot(msgEl, res.screenshot);
    } else if (res.error) {
      chipEl.classList.add("fail");
      console.warn("browser error:", res.error);
    }
  } catch (err) {
    chipEl.classList.remove("running");
    chipEl.classList.add("fail");
    console.warn("browser exception:", err);
  }
}

async function runComputerAction(chipEl, msgEl, block, blockIndex) {
  chipEl.classList.add("running");
  showScreenshotLoading(msgEl);
  const action = {
    action: block.action,
    target: block.target,
    x: block.x, y: block.y,
    x1: block.x1, y1: block.y1,
    x2: block.x2, y2: block.y2,
    value: block.value,
    keys: block.keys,
    dy: block.dy,
    seconds: block.seconds,
  };
  try {
    const res = await api("/api/computer/exec", {
      method: "POST",
      body: JSON.stringify({
        cid: state.currentId,
        mid: msgEl.dataset.mid,
        bidx: blockIndex,
        action,
      }),
    });
    chipEl.classList.remove("running");
    if (res.error === "disabled") {
      chipEl.classList.add("fail");
      console.warn("computer control disabled");
      return;
    }
    if (res.screenshot) {
      chipEl.classList.add("done");
      block.screenshot = res.screenshot;
      updateScreenshot(msgEl, res.screenshot);
    } else if (res.error) {
      chipEl.classList.add("fail");
      console.warn("computer error:", res.error);
    }
  } catch (err) {
    chipEl.classList.remove("running");
    chipEl.classList.add("fail");
    console.warn("computer exception:", err);
  }
}

function setMessageContent(msgEl, text, opts = {}) {
  if (!text) return;
  const animate = !!opts.animateText;
  const target = msgEl._contentEl;
  if (!target) return;

  const newEl = buildTextElement(text, animate);
  target.textContent = "";
  while (newEl.firstChild) target.appendChild(newEl.firstChild);
  target.style.display = "";
}

function hasActionBlocks(blocks) {
  if (!Array.isArray(blocks)) return false;
  return blocks.some(b => b && (b.type === "browser" || b.type === "project" || b.type === "computer" || b.type === "file"));
}

async function runProjectAction(chipEl, msgEl, block, blockIndex) {
  const pid = state.currentProjectId
    || (state.currentProject && state.currentProject.id);
  if (!pid) {
    chipEl.classList.add("fail");
    console.warn("no current project id for project action");
    return;
  }
  chipEl.classList.add("running");
  const action = {
    action: block.action,
    path: block.path,
    content: block.content,
    find: block.find,
    replace: block.replace,
    count: block.count,
  };
  try {
    const res = await api(`/api/projects/${pid}/exec`, {
      method: "POST",
      body: JSON.stringify({
        cid: state.currentId,
        mid: msgEl.dataset.mid,
        bidx: blockIndex,
        action,
      }),
    });
    chipEl.classList.remove("running");
    block.result = res;
    if (res && res.ok) {
      chipEl.classList.add("done");
    } else {
      chipEl.classList.add("fail");
    }

    await refreshProjectFiles();

    const affectedPath = res && res.path;
    if (affectedPath) {
      await openProjectFile(affectedPath);
    } else if (block.action === "read_file" && block.path) {
      await openProjectFile(block.path);
    }
  } catch (err) {
    chipEl.classList.remove("running");
    chipEl.classList.add("fail");
    console.warn("project exception:", err);
  }
}

async function runFileAction(chipEl, msgEl, block, blockIndex) {
  chipEl.classList.add("running");
  const action = {
    action: block.action,
    path: block.path,
    content: block.content,
  };
  try {
    const res = await api("/api/local/exec", {
      method: "POST",
      body: JSON.stringify({
        cid: state.currentId,
        mid: msgEl.dataset.mid,
        bidx: blockIndex,
        action,
      }),
    });
    chipEl.classList.remove("running");
    block.result = res;
    if (res && res.ok) {
      chipEl.classList.add("done");
      if (res.path) {
        const p = document.createElement("span");
        p.className = "path";
        p.textContent = res.path;
        chipEl.appendChild(p);
      }
    } else {
      chipEl.classList.add("fail");
      console.warn("file action error:", res && res.error);
    }
  } catch (err) {
    chipEl.classList.remove("running");
    chipEl.classList.add("fail");
    console.warn("file action exception:", err);
  }
}

function appendBlocksToMessage(msgEl, blocks, opts = {}) {
  const runBrowser = !!opts.runBrowser;
  const runProject = !!opts.runProject;
  const runComputer = !!opts.runComputer;
  const runFile = !!opts.runFile;
  const startIndex = (msgEl._blockCount || 0);
  const stepsEl = msgEl._stepsEl;

  return new Promise((resolve) => {
    let cumulative = 0;
    const promises = [];

    blocks.forEach((b, i) => {
      if (!b) return;

      let el = null;

      if (b.type === "reasoning" && b.text) {
        el = makeReasoning(b.text);
      } else if (b.type === "status" && b.text) {
        el = makeStatus(b.text, b.ok !== false);
      } else if (b.type === "browser" && b.text) {
        el = makeBrowserChip(b.text);
      } else if (b.type === "computer" && b.text) {
        el = makeComputerChip(b.text);
      } else if (b.type === "project" && b.text) {
        el = makeProjectChip(b.text, b.path);
      } else if (b.type === "file" && b.text) {
        el = makeFileChip(b.text, b.path);
      } else if (b.type === "memory") {
        el = makeStatus(b.text || "Обновляю память", !(b.result && b.result.ok === false));
      } else if (b.type === "image" && b.url) {
        el = makeMedia(b.url, b.filename, "image");
      } else if (b.type === "video" && b.url) {
        el = makeMedia(b.url, b.filename, "video");
      }
      if (!el) return;

      const delay = Math.max(0, Number(b.delay) || 0);
      cumulative += delay * 1000;

      el.style.display = "none";
      stepsEl.appendChild(el);

      if (b.type === "browser" && b.screenshot) {
        el.classList.add("done");
        updateScreenshot(msgEl, b.screenshot);
      }
      if (b.type === "browser" && b.downloads) {
        for (const d of b.downloads) {
          if (!d || !d.path) continue;
          const p = document.createElement("span");
          p.className = "path";
          p.textContent = d.path;
          el.appendChild(p);
        }
      }
      if (b.type === "computer" && b.screenshot) {
        el.classList.add("done");
        updateScreenshot(msgEl, b.screenshot);
      }
      if (b.type === "project" && b.result) {
        el.classList.add(b.result.ok ? "done" : "fail");
      }
      if (b.type === "file" && b.result) {
        el.classList.add(b.result.ok ? "done" : "fail");
      }

      const blockIndex = startIndex + i;
      const revealAt = cumulative;

      const p = new Promise((res) => {
        const show = () => {
          el.style.display = "";
          scrollBottom();
          res();
        };
        if (revealAt === 0) show();
        else setTimeout(show, revealAt);
      });
      promises.push(p);

      if (b.type === "browser" && runBrowser && !b.screenshot) {
        const bp = p.then(() => runBrowserAction(el, msgEl, b, blockIndex));
        promises.push(bp);
      }

      if (b.type === "computer" && runComputer && !b.screenshot) {
        const cp = p.then(() => runComputerAction(el, msgEl, b, blockIndex));
        promises.push(cp);
      }

      if (b.type === "project" && runProject && !b.result) {
        const pp = p.then(() => runProjectAction(el, msgEl, b, blockIndex));
        promises.push(pp);
      }

      if (b.type === "file" && runFile && !b.result) {
        const fp = p.then(() => runFileAction(el, msgEl, b, blockIndex));
        promises.push(fp);
      }
    });

    msgEl._blockCount = startIndex + blocks.length;
    Promise.all(promises).then(resolve);
  });
}

function buildMessage(m, opts = {}) {
  if (m.role === "assistant") {
    const el = createAssistantShell(m);
    appendBlocksToMessage(el, m.blocks || [], { runBrowser: false, runProject: false, runComputer: false, runFile: false });
    if (m.content) setMessageContent(el, m.content, { animateText: false });
    return el;
  }

  const wrap = document.createElement("div");
  wrap.className = "message user";
  wrap.dataset.mid = m.id;
  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (Array.isArray(m.attachments)) {
    for (const a of m.attachments) {
      if (!a || !a.url) continue;
      if (a.type === "image") bubble.appendChild(makeMedia(a.url, a.filename, "image"));
      else if (a.type === "video") bubble.appendChild(makeMedia(a.url, a.filename, "video"));
    }
  }
  if (m.content) {
    bubble.appendChild(buildTextElement(m.content, false));
  }
  wrap.appendChild(bubble);

  const actions = document.createElement("div");
  actions.className = "msg-actions";
  actions.style.alignSelf = "flex-end";
  const copyBtn = makeActionBtn(SVG_COPY, "Копировать", "copy");
  copyBtn.onclick = async (e) => {
    e.stopPropagation();
    if (await copyText(m.content || "")) flashCopy(copyBtn);
  };
  actions.appendChild(copyBtn);
  wrap.appendChild(actions);
  wrap.style.flexDirection = "column";
  wrap.style.alignItems = "flex-end";
  return wrap;
}

function renderMessages(chat) {
  messagesEl.innerHTML = "";
  const visible = (chat.messages || []).filter(m => !m.hidden);
  if (!visible.length) {
    let hint = "Напишите что-нибудь — я могу управлять браузером и рабочим столом.";
    if (state.view === "project") {
      hint = "Загрузите файлы слева или напишите, что сделать с проектом.";
    }
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.appendChild(buildBigBrand());
    const sub = document.createElement("div");
    sub.textContent = hint;
    empty.appendChild(sub);
    messagesEl.appendChild(empty);
    return;
  }
  for (const m of visible) messagesEl.appendChild(buildMessage(m));
  scrollBottom(false);
}

function scrollBottom(smooth = true) {
  requestAnimationFrame(() => {
    messagesEl.scrollTo({
      top: messagesEl.scrollHeight,
      behavior: smooth ? "smooth" : "auto",
    });
  });
}

function serializeBlocks() {
  const out = [];
  for (const b of state.blocks) {
    if (!b) continue;
    const item = { type: b.type, delay: b.delay || 0 };

    if (b.type === "reasoning") {
      item.text = (b.value || "").trim();
      if (!item.text) continue;
    } else if (b.type === "status") {
      item.text = (b.value || "").trim();
      item.ok = b.ok !== false;
      if (!item.text) continue;
    } else if (b.type === "browser") {
      item.action = b.action || "goto";
      item.text = (b.text || item.action).trim();
      if (b.url) item.url = b.url;
      if (b.selector) item.selector = b.selector;
      if (b.value) item.value = b.value;
      if (b.key) item.key = b.key;
      if (b.dy !== undefined && b.dy !== null) item.dy = b.dy;
      if (b.seconds !== undefined && b.seconds !== null) item.seconds = b.seconds;
    } else if (b.type === "computer") {
      item.action = b.action || "click";
      item.text = (b.text || item.action).trim();
      if (b.target) item.target = b.target;
      if (b.value) item.value = b.value;
      if (b.keys && b.keys.length) item.keys = b.keys;
      for (const k of ["x","y","x1","y1","x2","y2","dy"]) {
        if (b[k] !== undefined && b[k] !== null) item[k] = b[k];
      }
      if (b.seconds !== undefined && b.seconds !== null) item.seconds = b.seconds;
    } else if (b.type === "image" || b.type === "video") {
      if (!b.url) continue;
      item.url = b.url;
      item.filename = b.filename || "";
    } else {
      continue;
    }
    out.push(item);
  }
  return out;
}

function setSendMode(running) {
  const btn = sendBtn;
  btn.classList.toggle("stop", !!running);
  btn.title = running ? "Остановить" : "Отправить";
  btn.innerHTML = running
    ? `<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
         <rect x="2.5" y="2.5" width="9" height="9" rx="2"/>
       </svg>`
    : `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
         <path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/>
       </svg>`;
}

/* Кнопка «стоп»: рвём текущий запрос и выходим из цикла агента */
function stopAgent() {
  if (!state.agentRunning) return;
  state.stopped = true;
  try { state.abort && state.abort.abort(); } catch (e) {}
}

function isAbort(e) {
  return e && (e.name === "AbortError" || String(e.message || "").includes("aborted"));
}

async function send() {
  if (state.agentRunning) { stopAgent(); return; }

  const role = state.mode === "ai" ? "user" : state.role;
  const content = inputEl.value.trim();
  const blocks = role === "assistant" ? serializeBlocks() : [];
  const attachments = role === "user" ? state.attachments.slice() : [];

  if (!content && !blocks.length && !attachments.length) return;

  if (!state.currentId) await newChat();

  const body = {
    role,
    content,
    model: role === "assistant" ? state.model : null,
    blocks,
    attachments,
  };

  let msg;
  try {
    msg = await api(`/api/chats/${state.currentId}/messages`, {
      method: "POST",
      body: JSON.stringify(body),
    });
  } catch (e) { console.error(e); return; }

  inputEl.value = "";
  autoResize();
  clearBlocks();
  state.attachments = [];
  renderAttachments();

  messagesEl.querySelector(".empty")?.remove();

  const el = buildMessage(msg, {});
  messagesEl.appendChild(el);
  scrollBottom();

  if (role === "assistant") {
    const hasBrowser = blocks.some(b => b.type === "browser");
    const hasComputer = blocks.some(b => b.type === "computer");
    const hasFile = blocks.some(b => b.type === "file");
    if (hasBrowser || hasComputer || hasFile) {
      el._blockCount = 0;
      await appendBlocksToMessage(el, [], { runBrowser: true, runComputer: true, runFile: true });
    }
  }

  try {
    const chat = await api("/api/chats/" + state.currentId);
    if (state.view === "chat") titleEl.textContent = sanitizeTitle(chat.title);
  } catch (e) { /* ignore */ }
  await loadChats();

  if (state.mode === "ai" && role === "user") {
    state.agentRunning = true;
    state.stopped = false;
    state.abort = new AbortController();
    setSendMode(true);
    try {
      await runAgentCycle();
    } finally {
      state.agentRunning = false;
      state.abort = null;
      setSendMode(false);
    }
  }
}

async function runAgentCycle() {
  const el = createAssistantShell({ id: "pending", model: state.model, blocks: [] });
  el.dataset.mid = "pending";
  setWorking(el, true);
  messagesEl.appendChild(el);
  scrollBottom();

  let firstMsg;
  try {
    firstMsg = await api(`/api/chats/${state.currentId}/generate`, {
      method: "POST",
      body: JSON.stringify({ model: state.model }),
    });
  } catch (e) {
    setWorking(el, false);
    el.remove();
    if (!isAbort(e)) renderError(e);
    return;
  }

  el.dataset.mid = firstMsg.id;
  setWorking(el, false);

  await appendBlocksToMessage(el, firstMsg.blocks || [], {
    runBrowser: true,
    runProject: true,
    runComputer: true,
    runFile: true,
  });

  if (firstMsg.content) {
    setMessageContent(el, firstMsg.content, { animateText: true });
    scrollBottom();
  }

    let steps = 0;
    let reasoningOnlyStreak = 0;
    // Первый ответ считается завершённым, если в нём нет action-блоков
    // И сервер явно не сказал, что мы в процессе. При первом ответе
    // done обычно не выставляется — тогда смотрим просто на наличие
    // action-блоков.
    let done = !hasActionBlocks(firstMsg.blocks);
    if (firstMsg.done === false) done = false;

  while (!done && steps < MAX_AGENT_STEPS) {
    if (state.stopped) break;
    setWorking(el, true);
    scrollBottom();

    let resp;
    try {
      resp = await api(`/api/chats/${state.currentId}/generate/continue`, {
        method: "POST",
        body: JSON.stringify({ mid: firstMsg.id, model: state.model }),
      });
    } catch (e) {
      setWorking(el, false);
      if (!isAbort(e)) renderError(e);
      break;
    }

    if (state.stopped) { setWorking(el, false); break; }

    setWorking(el, false);

    const blocks = (resp && resp.blocks) || [];
    const hasAction = hasActionBlocks(blocks);
    const hasContent = !!(resp && resp.content);

    await appendBlocksToMessage(el, blocks, {
      runBrowser: true,
      runProject: true,
      runComputer: true,
      runFile: true,
    });

    if (hasContent) {
      setMessageContent(el, resp.content, { animateText: true });
      scrollBottom();
    }

    if (!resp || resp.done) {
      done = true;
      break;
    }

    if (!hasAction && !hasContent) {
      reasoningOnlyStreak++;
      if (reasoningOnlyStreak >= 3) {
        console.warn("Model stuck on reasoning-only steps, stopping.");
        break;
      }
    } else {
      reasoningOnlyStreak = 0;
    }

    steps++;
  }

  setWorking(el, false);

  if (state.stopped) {
    // сигнал уже сработал — дальше дочитываем данные обычными запросами
    state.abort = null;
    const stopNote = makeStatus("Остановлено пользователем", false);
    el._stepsEl.appendChild(stopNote);
    scrollBottom();
  }

  try {
    await loadChats();
  } catch (e) { /* ignore */ }
  if (state.view === "chat") {
    try {
      const chat = await api("/api/chats/" + state.currentId);
      titleEl.textContent = sanitizeTitle(chat.title);
    } catch (e) { /* ignore */ }
  }
  if (state.view === "project") {
    try { await refreshProjectFiles(); } catch (e) { /* ignore */ }
  }
}

function currentModelList() {
  if (state.mode === "ai") {
    return state.lmModels.length ? state.lmModels : ["LM Studio не отвечает"];
  }
  return MODELS;
}

async function loadLmModels() {
  try {
    const list = await api("/api/models");
    state.lmModels = Array.isArray(list) ? list.filter(Boolean) : [];
  } catch (e) {
    state.lmModels = [];
  }
  syncModelWithMode();
}

/* Модель должна быть из текущего списка режима */
function syncModelWithMode() {
  const list = currentModelList();
  if (!list.includes(state.model)) {
    state.model = state.mode === "ai" ? (list[0] || "") : "Zimple-v2";
  }
  const nameEl = $("model-name");
  if (nameEl) nameEl.textContent = state.model;
  renderModelMenu();
  updatePlaceholder();
}

function renderModelMenu() {
  const menu = $("model-menu");
  menu.innerHTML = "";
  for (const m of currentModelList()) {
    const item = document.createElement("div");
    item.className = "menu-item" + (m === state.model ? " active" : "");
    item.innerHTML = `<span>${m}</span>
      <svg class="check" width="12" height="12" viewBox="0 0 12 12" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 6.5l2.8 2.8L10 3.5"/>
      </svg>`;
    item.onclick = () => {
      state.model = m;
      $("model-name").textContent = m;
      renderModelMenu();
      closeMenus();
      updatePlaceholder();
    };
    menu.appendChild(item);
  }
}

function updatePlaceholder() {
  if (state.mode === "ai") {
    inputEl.placeholder = state.view === "project"
      ? "Что сделать с проектом?"
      : "Написать сообщение (ответит ИИ)...";
  } else if (state.role === "assistant") {
    inputEl.placeholder = `Ручной ответ от ${state.model}...`;
  } else {
    inputEl.placeholder = "Написать сообщение...";
  }
}

function closeMenus() {
  document.querySelectorAll(".menu.open").forEach((m) => m.classList.remove("open"));
  document.querySelectorAll(".pill.open, .icon-btn.open").forEach((b) => b.classList.remove("open"));
}

function bindMenu(btnId, menuId) {
  const btn = $(btnId);
  const menu = $(menuId);
  if (!btn || !menu) return;
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = menu.classList.contains("open");
    closeMenus();
    if (!isOpen) {
      menu.classList.add("open");
      btn.classList.add("open");
    }
  });
  menu.addEventListener("click", (e) => e.stopPropagation());
}

function renderModeMenu() {
  document.querySelectorAll(".mode-option").forEach((el) => {
    el.classList.toggle("active", el.dataset.mode === state.mode);
  });
  const roleSection = document.querySelector(".role-section");
  if (roleSection) roleSection.style.display = state.mode === "ai" ? "none" : "";
}

function bindModeMenu() {
  document.querySelectorAll(".mode-option").forEach((el) => {
    el.addEventListener("click", () => {
      state.mode = el.dataset.mode;
      if (state.mode === "ai") {
        state.role = "user";
        if (!state.lmModels.length) loadLmModels();
      }
      syncModelWithMode();
      renderModeMenu();
      renderRoleMenu();
      updateStylerVisibility();
      updatePlaceholder();
      closeMenus();
      inputEl.focus();
    });
  });
}

function renderRoleMenu() {
  document.querySelectorAll(".role-option").forEach((el) => {
    el.classList.toggle("active", el.dataset.role === state.role);
  });
}

function bindRoleMenu() {
  document.querySelectorAll(".role-option").forEach((el) => {
    el.addEventListener("click", () => {
      if (state.mode === "ai") return;
      state.role = el.dataset.role;
      renderRoleMenu();
      updateStylerVisibility();
      updatePlaceholder();
      closeMenus();

function clearBlocks() {
  state.blocks = [];
  renderBlocks();
}

function addBlock(type, extra = {}) {
  const id = Math.random().toString(36).slice(2, 8);
  const block = { id, type, value: "", ok: true, delay: 0, ...extra };
  state.blocks.push(block);
  renderBlocks();
  requestAnimationFrame(() => {
    const el = document.querySelector(
      `.block[data-id="${id}"] input[type="text"], .block[data-id="${id}"] input[type="url"], .block[data-id="${id}"] textarea`
    );
    el?.focus();
    const container = $("blocks");
    container.scrollTop = container.scrollHeight;
  });
}

function addPresetStatus(text) {
  const id = Math.random().toString(36).slice(2, 8);
  state.blocks.push({ id, type: "status", value: text, ok: true, delay: 0 });
  renderBlocks();
}

function removeBlock(id) {
  state.blocks = state.blocks.filter(b => b.id !== id);
  renderBlocks();
}

function makeDelayWrap(block) {
  const wrap = document.createElement("div");
  wrap.className = "delay-wrap";
  const inp = document.createElement("input");
  inp.type = "number";
  inp.min = "0";
  inp.step = "0.1";
  inp.value = block.delay ?? 0;
  inp.title = "Задержка перед появлением этого блока, сек.";
  inp.oninput = () => {
    const v = parseFloat(inp.value);
    block.delay = isFinite(v) && v > 0 ? v : 0;
  };
  const unit = document.createElement("span");
  unit.textContent = "с";
  wrap.appendChild(inp);
  wrap.appendChild(unit);
  return wrap;
}

function renderBlocks() {
  const container = $("blocks");
  container.innerHTML = "";
  for (const b of state.blocks) {
    const row = document.createElement("div");
    row.className = "block " + b.type;
    row.dataset.id = b.id;

    if (b.type === "status") {
      const tog = document.createElement("button");
      tog.type = "button";
      tog.className = "status-toggle " + (b.ok ? "ok" : "fail");
      tog.innerHTML = b.ok ? SVG_CHECK : SVG_CROSS;
      tog.title = b.ok ? "Успешно" : "Провал";
      tog.onclick = (e) => {
        e.preventDefault();
        b.ok = !b.ok;
        tog.className = "status-toggle " + (b.ok ? "ok" : "fail");
        tog.innerHTML = b.ok ? SVG_CHECK : SVG_CROSS;
      };
      row.appendChild(tog);
      const inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "Статус, напр. «Написал код»";
      inp.value = b.value;
      inp.oninput = () => { b.value = inp.value; };
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); addBlock("status"); }
      });
      row.appendChild(inp);

    } else if (b.type === "reasoning") {
      const ta = document.createElement("textarea");
      ta.rows = 2;
      ta.placeholder = "Reasoning — размышления модели...";
      ta.value = b.value;
      ta.oninput = () => {
        b.value = ta.value;
        ta.style.height = "auto";
        ta.style.height = Math.min(ta.scrollHeight, 200) + "px";
      };
      requestAnimationFrame(() => {
        ta.style.height = "auto";
        ta.style.height = Math.min(ta.scrollHeight, 200) + "px";
      });
      row.appendChild(ta);

    } else if (b.type === "image" || b.type === "video") {
      const thumb = document.createElement("div");
      thumb.className = "media-thumb";
      if (b.type === "image") {
        const img = document.createElement("img");
        img.src = b.url;
        thumb.appendChild(img);
      } else {
        const v = document.createElement("video");
        v.src = b.url;
        v.muted = true;
        v.preload = "metadata";
        thumb.appendChild(v);
      }
      row.appendChild(thumb);
      const info = document.createElement("div");
      info.className = "media-info";
      const name = document.createElement("div");
      name.className = "media-name";
      name.textContent = b.filename || (b.type === "image" ? "Изображение" : "Видео");
      const kind = document.createElement("div");
      kind.className = "media-kind";
      kind.textContent = b.type === "image" ? "Изображение" : "Видео";
      info.appendChild(name);
      info.appendChild(kind);
      row.appendChild(info);

    } else if (b.type === "browser") {
      const select = document.createElement("select");
      for (const a of BROWSER_ACTIONS) {
        const opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        if ((b.action || "goto") === a) opt.selected = true;
        select.appendChild(opt);
      }
      select.onchange = () => { b.action = select.value; renderBlocks(); };

      const textInp = document.createElement("input");
      textInp.type = "text";
      textInp.placeholder = "Описание, напр. «Открываю Google»";
      textInp.value = b.text || "";
      textInp.oninput = () => { b.text = textInp.value; };

      const row1 = document.createElement("div");
      row1.className = "browser-row";
      row1.appendChild(select);
      row1.appendChild(textInp);
      row.appendChild(row1);

      const extras = document.createElement("div");
      extras.className = "browser-row";
      const act = b.action || "goto";
      if (act === "goto") {
        const urlInp = document.createElement("input");
        urlInp.type = "url";
        urlInp.placeholder = "https://example.com";
        urlInp.value = b.url || "";
        urlInp.oninput = () => { b.url = urlInp.value; };
        extras.appendChild(urlInp);
      } else if (act === "click") {
        const selInp = document.createElement("input");
        selInp.type = "text";
        selInp.placeholder = "CSS-селектор, напр. button.submit";
        selInp.value = b.selector || "";
        selInp.oninput = () => { b.selector = selInp.value; };
        extras.appendChild(selInp);
      } else if (act === "type") {
        const selInp = document.createElement("input");
        selInp.type = "text";
        selInp.placeholder = "Селектор, напр. input[name=q]";
        selInp.value = b.selector || "";
        selInp.oninput = () => { b.selector = selInp.value; };
        extras.appendChild(selInp);
        const valInp = document.createElement("input");
        valInp.type = "text";
        valInp.placeholder = "Текст для ввода";
        valInp.value = b.value || "";
        valInp.oninput = () => { b.value = valInp.value; };
        extras.appendChild(valInp);
      } else if (act === "press") {
        const keyInp = document.createElement("input");
        keyInp.type = "text";
        keyInp.placeholder = "Клавиша, напр. Enter";
        keyInp.value = b.key || "Enter";
        keyInp.oninput = () => { b.key = keyInp.value; };
        extras.appendChild(keyInp);
      } else if (act === "scroll") {
        const dyInp = document.createElement("input");
        dyInp.type = "number";
        dyInp.placeholder = "Пиксели, напр. 600";
        dyInp.value = b.dy ?? 600;
        dyInp.oninput = () => { b.dy = parseInt(dyInp.value) || 600; };
        extras.appendChild(dyInp);
      } else if (act === "wait") {
        const secInp = document.createElement("input");
        secInp.type = "number";
        secInp.step = "0.1";
        secInp.placeholder = "Секунды";
        secInp.value = b.seconds ?? 2;
        secInp.oninput = () => { b.seconds = parseFloat(secInp.value) || 0; };
        extras.appendChild(secInp);
      }
      if (extras.children.length) row.appendChild(extras);

    } else if (b.type === "computer") {
      const select = document.createElement("select");
      for (const a of COMPUTER_ACTIONS) {
        const opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        if ((b.action || "click") === a) opt.selected = true;
        select.appendChild(opt);
      }
      select.onchange = () => { b.action = select.value; renderBlocks(); };

      const textInp = document.createElement("input");
      textInp.type = "text";
      textInp.placeholder = "Описание, напр. «Кликаю по кнопке»";
      textInp.value = b.text || "";
      textInp.oninput = () => { b.text = textInp.value; };

      const row1 = document.createElement("div");
      row1.className = "browser-row";
      row1.appendChild(select);
      row1.appendChild(textInp);
      row.appendChild(row1);

      const extras = document.createElement("div");
      extras.className = "browser-row";
      const act = b.action || "click";

      const addNum = (key, placeholder) => {
        const inp = document.createElement("input");
        inp.type = "number";
        inp.placeholder = placeholder;
        inp.value = b[key] ?? "";
        inp.style.maxWidth = "80px";
        inp.oninput = () => {
          const v = inp.value.trim();
          b[key] = v === "" ? null : parseInt(v);
        };
        extras.appendChild(inp);
      };

      if (act === "click" || act === "double_click") {
        const tInp = document.createElement("input");
        tInp.type = "text";
        tInp.placeholder = "ID элемента (el_N)";
        tInp.value = b.target || "";
        tInp.oninput = () => { b.target = tInp.value; };
        extras.appendChild(tInp);
        addNum("x", "x");
        addNum("y", "y");
      } else if (act === "right_click") {
        addNum("x", "x");
        addNum("y", "y");
      } else if (act === "type") {
        const vInp = document.createElement("input");
        vInp.type = "text";
        vInp.placeholder = "Текст для ввода (поддерживает юникод)";
        vInp.value = b.value || "";
        vInp.oninput = () => { b.value = vInp.value; };
        extras.appendChild(vInp);
      } else if (act === "key") {
        const kInp = document.createElement("input");
        kInp.type = "text";
        kInp.placeholder = "ctrl,s  или  alt,tab";
        const cur = Array.isArray(b.keys) ? b.keys.join(",") : (b.keys || "");
        kInp.value = cur;
        kInp.oninput = () => {
          b.keys = kInp.value.split(",").map(s => s.trim()).filter(Boolean);
        };
        extras.appendChild(kInp);
      } else if (act === "scroll") {
        addNum("dy", "Пиксели");
      } else if (act === "move") {
        addNum("x", "x");
        addNum("y", "y");
      } else if (act === "drag") {
        addNum("x1", "x1");
        addNum("y1", "y1");
        addNum("x2", "x2");
        addNum("y2", "y2");
      } else if (act === "wait") {
        const secInp = document.createElement("input");
        secInp.type = "number";
        secInp.step = "0.1";
        secInp.placeholder = "Секунды";
        secInp.value = b.seconds ?? 2;
        secInp.style.maxWidth = "90px";
        secInp.oninput = () => { b.seconds = parseFloat(secInp.value) || 0; };
        extras.appendChild(secInp);
      }
      if (extras.children.length) row.appendChild(extras);
    }

    row.appendChild(makeDelayWrap(b));
    const rm = document.createElement("button");
    rm.className = "remove";
    rm.innerHTML = "&times;";
    rm.title = "Удалить";
    rm.onclick = () => removeBlock(b.id);
    row.appendChild(rm);
    container.appendChild(row);
  }
}

function updateStylerVisibility() {
  const show = state.mode === "manual" && state.role === "assistant";
  $("styler-row").classList.toggle("hidden", !show);
  if (!show) clearBlocks();
}

function renderAttachments() {
  const row = $("attachments-row");
  row.innerHTML = "";
  state.attachments.forEach((a, i) => {
    const el = document.createElement("div");
    el.className = "attachment-thumb";
    if (a.type === "image") {
      const img = document.createElement("img");
      img.src = a.url;
      el.appendChild(img);
    } else {
      const v = document.createElement("video");
      v.src = a.url;
      v.muted = true;
      v.preload = "metadata";
      v.playsInline = true;
      el.appendChild(v);
    }
    const rm = document.createElement("button");
    rm.className = "remove-mini";
    rm.innerHTML = "&times;";
    rm.title = "Удалить";
    rm.onclick = () => {
      state.attachments.splice(i, 1);
      renderAttachments();
    };
    el.appendChild(rm);
    row.appendChild(el);
  });
}

async function refreshComputerStatus() {
  try {

  } catch (e) { /* ignore */ }

async function setComputerEnabled(enabled) {

    const res = await api("/api/computer/toggle", {

    updatePcIndicator(state.computerEnabled);

async function ensureComputerEnabled() {
  try {
    const st = await api("/api/computer/status");

      alert("Управление ПК недоступно.\n\nУстанови на сервере:\n" +
            "pip install mss pyautogui uiautomation pyperclip");
      return false;
    }
    if (!st.enabled) {
      const ok = confirm(
        "Разрешить ИИ управлять рабочим столом?\n\n" +
        "ИИ сможет кликать мышью, печатать текст и нажимать клавиши " +
        "на этом компьютере. Отключить можно в меню чата."
      );

      await setComputerEnabled(true);
    }
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}


/* ---------- Голосовой ввод (Web Speech API) ---------- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let _rec = null;
let _recBase = "";
let _recFinal = "";

function voiceSupported() { return !!SpeechRec; }

function showVoiceHint(text) {
  let hint = $("voice-hint");
  if (!text) { hint?.remove(); return; }
  if (!hint) {
    hint = document.createElement("div");
    hint.className = "voice-hint";
    hint.id = "voice-hint";
    inputEl.closest(".input-row").before(hint);
  }
  hint.textContent = text;
}

function startVoice() {
  if (!voiceSupported() || state.listening) return;
  try {
    _rec = new SpeechRec();
  } catch (e) { console.warn(e); return; }

  _rec.lang = "ru-RU";
  _rec.continuous = true;
  _rec.interimResults = true;

  _recBase = inputEl.value.trim();
  _recFinal = "";

  _rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const tr = e.results[i][0].transcript;
      if (e.results[i].isFinal) _recFinal += tr;
      else interim += tr;
    }
    const merged = [_recBase, (_recFinal + interim).trim()].filter(Boolean).join(" ");
    inputEl.value = merged;
    autoResize();
  };
  _rec.onerror = (e) => {
    console.warn("speech error:", e.error);
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      showVoiceHint("Нет доступа к микрофону");
      setTimeout(() => showVoiceHint(""), 2500);
    }
    stopVoice();
  };
  _rec.onend = () => {
    if (state.listening) stopVoice();
  };

  try {
    _rec.start();
    state.listening = true;
    $("mic-btn")?.classList.add("listening");
    showVoiceHint("Говорите…");
  } catch (e) { console.warn(e); }
}

function stopVoice() {
  state.listening = false;
  $("mic-btn")?.classList.remove("listening");
  showVoiceHint("");
  try { _rec && _rec.stop(); } catch (e) {}
  _rec = null;
  inputEl.focus();
}

function bindVoice() {
  const btn = $("mic-btn");
  if (!btn) return;
  if (!voiceSupported()) {
    btn.classList.add("unsupported");
    btn.title = "Голосовой ввод не поддерживается этим браузером";
    btn.addEventListener("click", () => {
      showVoiceHint("Голосовой ввод работает в Chrome/Edge");
      setTimeout(() => showVoiceHint(""), 2500);
    });
    return;
  }
  // удерживать — говорить, отпустить — текст в поле
  const down = (e) => { e.preventDefault(); startVoice(); };
  const up = (e) => { e.preventDefault(); stopVoice(); };
  btn.addEventListener("mousedown", down);
  btn.addEventListener("touchstart", down, { passive: false });
  document.addEventListener("mouseup", () => { if (state.listening) stopVoice(); });
  btn.addEventListener("touchend", up);
  btn.addEventListener("touchcancel", up);
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
}

/* ---------- Память ИИ ---------- */
function openMemoryModal() {
  const modal = $("memory-modal");
  if (!modal) return;
  modal.hidden = false;
  requestAnimationFrame(() => modal.classList.add("open"));
  const ta = $("memory-text");
  ta.value = "Загрузка...";
  api("/api/memory").then((data) => {
    ta.value = data.text || "";
    $("memory-path").textContent = data.path || "";
    ta.focus();
  }).catch((e) => { ta.value = ""; console.error(e); });
}

function closeMemoryModal() {
  const modal = $("memory-modal");
  if (!modal) return;
  modal.classList.remove("open");
  setTimeout(() => { modal.hidden = true; }, 220);
}

async function saveMemory(text) {
  try {
    await api("/api/memory", {
      method: "POST",
      body: JSON.stringify({ action: "replace", text }),
    });
  } catch (e) { console.error(e); }
}

function bindMemoryModal() {
  $("memory-btn")?.addEventListener("click", () => { closeMenus(); openMemoryModal(); });
  $("memory-close")?.addEventListener("click", closeMemoryModal);
  $("memory-modal")?.addEventListener("click", (e) => {
    if (e.target.id === "memory-modal") closeMemoryModal();
  });
  $("memory-save")?.addEventListener("click", async () => {
    await saveMemory($("memory-text").value);
    closeMemoryModal();
  });
  $("memory-clear")?.addEventListener("click", async () => {
    if (!confirm("Очистить память ИИ полностью?")) return;
    $("memory-text").value = "";
    await saveMemory("");
    closeMemoryModal();
  });
}

/* ---------- Init ---------- */
async function init() {
  animateBrand();
  await initDevice();
  bindVoice();
  bindMemoryModal();
  setSendMode(false);
  renderModelMenu();
  renderModeMenu();
  renderRoleMenu();
  bindMenu("model-btn", "model-menu");
  bindMenu("tools-btn", "tools-menu");
  bindMenu("chat-menu-btn", "chat-menu");
  bindModeMenu();
  bindRoleMenu();

  const sidebar = $("sidebar");
  const overlay = $("sidebar-overlay");
  const ham = $("hamburger-btn");
  if (ham) ham.addEventListener("click", () => setSidebar(!sidebar.classList.contains("open")));
  if (overlay) overlay.addEventListener("click", () => setSidebar(false));

  window.addEventListener("resize", () => {
    if (!isMobile()) {
      setSidebar(false);
      $("project-side").classList.remove("mobile-open");
    } else {
      $("project-toggle-btn").hidden = state.view !== "project";
    }
  });

  $("project-toggle-btn").addEventListener("click", () => {
    const ps = $("project-side");
    ps.classList.toggle("mobile-open");
  });

  const projSide = $("project-side");
  ["dragenter", "dragover"].forEach(ev => {
    projSide.addEventListener(ev, (e) => {
      e.preventDefault();
      projSide.classList.add("dragover");
    });
  });
  ["dragleave", "drop"].forEach(ev => {
    projSide.addEventListener(ev, (e) => {
      e.preventDefault();
      projSide.classList.remove("dragover");
    });
  });
  projSide.addEventListener("drop", async (e) => {
    const dt = e.dataTransfer;
    if (!dt || !dt.files || !dt.files.length) return;
    await uploadProjectFiles(dt.files);
  });

  $("project-upload-btn").addEventListener("click", () => {
    const inp = $("project-upload-input");
    inp.value = "";
    inp.click();
  });
  $("project-upload-input").addEventListener("change", async (e) => {
    const files = e.target.files;
    e.target.value = "";
    if (!files || !files.length) return;
    await uploadProjectFiles(files);
  });

  $("section-add-btn").addEventListener("click", newProject);

  $("add-reasoning").addEventListener("click", () => addBlock("reasoning"));
  $("add-status").addEventListener("click", () => addBlock("status"));
  $("add-status-image").addEventListener("click", () => addPresetStatus("Генерация изображения"));
  $("add-status-video").addEventListener("click", () => addPresetStatus("Генерация видео"));
  $("add-browser").addEventListener("click", () => addBlock("browser", {
    action: "goto",
    text: "Открываю сайт",
    url: "https://example.com",
    delay: 2,
  }));

  $("add-computer").addEventListener("click", async () => {
    const ok = await ensureComputerEnabled();
    if (!ok) return;
    addBlock("computer", {
      action: "click",
      text: "Кликаю",
      delay: 1,
    });
  });

  $("add-image").addEventListener("click", () => {
    const inp = $("ai-media-input");
    inp.accept = "image/*";
    inp.dataset.kind = "image";
    inp.value = "";
    inp.click();
  });
  $("add-video").addEventListener("click", () => {
    const inp = $("ai-media-input");
    inp.accept = "video/*";
    inp.dataset.kind = "video";
    inp.value = "";
    inp.click();
  });

  $("attach-btn").addEventListener("click", () => {
    const inp = $("user-attach-input");
    inp.value = "";
    inp.click();
  });
  $("user-attach-input").addEventListener("change", async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    for (const f of files) {
      try {
        const info = await uploadFile(f);
        if (info.kind !== "image" && info.kind !== "video") continue;
        state.attachments.push({
          type: info.kind,
          url: info.url,
          filename: info.filename,
        });
      } catch (err) { console.error(err); }
    }
    renderAttachments();
  });

  $("ai-media-input").addEventListener("change", async (e) => {
    const file = (e.target.files || [])[0];
    const kind = e.target.dataset.kind || "image";
    e.target.value = "";
    if (!file) return;
    try {
      const info = await uploadFile(file);
      addBlock(kind, { url: info.url, filename: info.filename, value: "" });
    } catch (err) { console.error(err); }
  });

  $("new-chat").addEventListener("click", newChat);
  $("projects-btn").addEventListener("click", async () => {
    state.listMode = "projects";
    updateSectionUI();
    await loadProjects();
    renderList();
  });

  $("close-browser-btn").addEventListener("click", async () => {
    closeMenus();
    try {
      await api("/api/browser/close", { method: "POST", body: "{}" });
    } catch (e) { console.error(e); }
  });

  $("toggle-computer-btn").addEventListener("click", async () => {
    closeMenus();
    if (state.computerEnabled) {
      await setComputerEnabled(false);
    } else {
      await ensureComputerEnabled();
    }
  });

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !isMobile()) {
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener("input", autoResize);

  document.addEventListener("click", () => { closeMenus(); closeCtxMenu(); });
  window.addEventListener("resize", closeCtxMenu);
  chatListEl.addEventListener("scroll", closeCtxMenu);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeMenus();
      closeCtxMenu();
      if (!$("memory-modal").hidden) closeMemoryModal();
      if (state.listening) stopVoice();
      if (isMobile()) setSidebar(false);
    }
  });

  // Initial
  state.listMode = "chats";
  updateSectionUI();
  await refreshComputerStatus();
  await loadLabels();
  await loadLmModels();
  await loadChats();
  renderList();
  if (state.chats.length) {
    await openChat(state.chats[0].id);
  } else {
    await newChat();
  }
  updatePlaceholder();
  if (!isMobile()) inputEl.focus();
}

init().catch(console.error);
</script>
</body>
</html>
